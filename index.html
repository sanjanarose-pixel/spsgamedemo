<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Predictive RPS AI</title>

<script type="module">

import {
    HandLandmarker,
    FilesetResolver
}
from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.1/+esm";


let handLandmarker;

let running = false;

let previousFeatures = null;

let movementHistory = [];

let predictionLocked = false;

let playerScore = 0;
let robotScore = 0;

let lastVideoTime = -1;


/* ---------------------------------------
   MEDIAPIPE INITIALIZATION
--------------------------------------- */

async function initializeAI() {

    const vision =
        await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.1/wasm"
        );


    handLandmarker =
        await HandLandmarker.createFromOptions(
            vision,
            {

                baseOptions: {

                    modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"

                },

                runningMode: "VIDEO",

                numHands: 1

            }
        );


    document.getElementById("status").innerText =
        "AI READY 🤖";

}


/* ---------------------------------------
   CAMERA
--------------------------------------- */

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: "user",

                    width: {
                        ideal: 640
                    },

                    height: {
                        ideal: 480
                    }

                },

                audio: false

            });


        const video =
            document.getElementById("camera");

        video.srcObject = stream;

        await video.play();


        running = true;

        document.getElementById("status").innerText =
            "SHOW ME YOUR MOVE ✋";


        requestAnimationFrame(processFrame);


    }

    catch(error) {

        document.getElementById("status").innerText =
            "Camera permission required ❌";

        console.error(error);

    }

}


/* ---------------------------------------
   PROCESS CAMERA FRAMES
--------------------------------------- */

async function processFrame() {

    if (!running) return;


    const video =
        document.getElementById("camera");


    if (
        video.readyState >= 2 &&
        video.currentTime !== lastVideoTime
    ) {

        lastVideoTime = video.currentTime;


        const results =
            handLandmarker.detectForVideo(
                video,
                performance.now()
            );


        if (
            results.landmarks &&
            results.landmarks.length > 0
        ) {

            const landmarks =
                results.landmarks[0];


            analyzeHand(landmarks);

        }

    }


    requestAnimationFrame(processFrame);

}


/* ---------------------------------------
   HAND ANALYSIS
--------------------------------------- */

function analyzeHand(hand) {

    /*
        MediaPipe gives us 21 points.

        Important points:

        Thumb
        Index
        Middle
        Ring
        Pinky

        We calculate whether each finger
        is extended or curled.
    */


    const features =
        getFingerFeatures(hand);


    /*
        Calculate movement.

        This lets us look at how the hand
        is changing instead of only looking
        at the final pose.
    */

    let movement = 0;


    if (previousFeatures !== null) {

        for (let i = 0; i < features.length; i++) {

            movement +=
                Math.abs(
                    features[i] -
                    previousFeatures[i]
                );

        }

    }


    previousFeatures = features;


    movementHistory.push({

        features: features,

        movement: movement,

        time: Date.now()

    });


    /*
        Keep approximately the last
        1.5 seconds of movement.
    */

    const now = Date.now();

    movementHistory =
        movementHistory.filter(
            item => now - item.time < 1500
        );


    /*
        Don't immediately predict.

        Wait until we have enough
        movement information.
    */

    if (
        movementHistory.length > 8 &&
        !predictionLocked
    ) {

        const prediction =
            predictMove();


        if (prediction.confidence >= 70) {

            lockPrediction(
                prediction.move,
                prediction.confidence
            );

        }

    }

}


/* ---------------------------------------
   FINGER FEATURES
--------------------------------------- */

function getFingerFeatures(hand) {

    /*
        Landmark indexes:

        0  = wrist

        Thumb:
        4  = tip

        Index:
        8  = tip

        Middle:
        12 = tip

        Ring:
        16 = tip

        Pinky:
        20 = tip
    */


    const wrist = hand[0];


    const thumb =
        distance(hand[4], wrist);

    const index =
        distance(hand[8], wrist);

    const middle =
        distance(hand[12], wrist);

    const ring =
        distance(hand[16], wrist);

    const pinky =
        distance(hand[20], wrist);


    /*
        Normalize using palm size.
    */

    const palm =
        distance(hand[0], hand[9]);


    return [

        thumb / palm,

        index / palm,

        middle / palm,

        ring / palm,

        pinky / palm

    ];

}


/* ---------------------------------------
   DISTANCE
--------------------------------------- */

function distance(a, b) {

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    const dz =
        a.z - b.z;


    return Math.sqrt(

        dx * dx +
        dy * dy +
        dz * dz

    );

}


/* ---------------------------------------
   PREDICTION ENGINE
--------------------------------------- */

function predictMove() {

    /*
        Take the most recent hand state.
    */

    const current =
        movementHistory[
            movementHistory.length - 1
        ].features;


    const thumb =
        current[0];

    const index =
        current[1];

    const middle =
        current[2];

    const ring =
        current[3];

    const pinky =
        current[4];


    /*
        Estimate finger states.

        Large distance from wrist
        = extended finger.

        Small distance
        = curled finger.
    */


    const indexOpen =
        index > 1.35;

    const middleOpen =
        middle > 1.30;

    const ringOpen =
        ring > 1.25;

    const pinkyOpen =
        pinky > 1.20;


    const openCount =

        (indexOpen ? 1 : 0) +
        (middleOpen ? 1 : 0) +
        (ringOpen ? 1 : 0) +
        (pinkyOpen ? 1 : 0);


    /*
        ROCK

        Most fingers curled.
    */

    if (openCount <= 1) {

        return {

            move: "ROCK",

            confidence: 82

        };

    }


    /*
        PAPER

        Almost all fingers open.
    */

    if (openCount >= 4) {

        return {

            move: "PAPER",

            confidence: 86

        };

    }


    /*
        SCISSORS

        Index + middle open,
        ring + pinky curled.
    */

    if (
        indexOpen &&
        middleOpen &&
        !ringOpen &&
        !pinkyOpen
    ) {

        return {

            move: "SCISSORS",

            confidence: 90

        };

    }


    /*
        If the pose is incomplete,
        look at the direction it is moving.

        This is what makes this different
        from simply recognizing the final pose.
    */


    const recent =
        movementHistory.slice(-5);


    let indexTrend = 0;
    let middleTrend = 0;
    let ringTrend = 0;
    let pinkyTrend = 0;


    if (recent.length >= 2) {

        const first =
            recent[0].features;

        const last =
            recent[recent.length - 1].features;


        indexTrend =
            last[1] - first[1];

        middleTrend =
            last[2] - first[2];

        ringTrend =
            last[3] - first[3];

        pinkyTrend =
            last[4] - first[4];

    }


    /*
        Fingers closing together
        suggests ROCK.
    */

    if (
        indexTrend < -0.08 &&
        middleTrend < -0.08 &&
        ringTrend < -0.05
    ) {

        return {

            move: "ROCK",

            confidence: 73

        };

    }


    /*
        Index + middle extending while
        ring + pinky stay relatively closed
        suggests SCISSORS.
    */

    if (
        indexTrend > 0.05 &&
        middleTrend > 0.05 &&
        ringTrend < 0.04
    ) {

        return {

            move: "SCISSORS",

            confidence: 75

        };

    }


    /*
        Several fingers extending
        suggests PAPER.
    */

    if (
        indexTrend > 0.04 &&
        middleTrend > 0.04 &&
        ringTrend > 0.04 &&
        pinkyTrend > 0.04
    ) {

        return {

            move: "PAPER",

            confidence: 76

        };

    }


    return {

        move: "ANALYZING",

        confidence: 0

    };

}


/* ---------------------------------------
   LOCK PREDICTION
--------------------------------------- */

function lockPrediction(
    move,
    confidence
) {

    predictionLocked = true;


    document.getElementById(
        "prediction"
    ).innerText = move;


    document.getElementById(
        "confidence"
    ).innerText =
        "AI confidence: " +
        confidence +
        "%";


    document.getElementById(
        "status"
    ).innerText =
        "I KNOW YOUR MOVE 😈";


    /*
        Choose the counter.
    */

    const counter =
        getCounter(move);


    setTimeout(() => {

        showResult(move, counter);

    }, 800);

}


/* ---------------------------------------
   COUNTER
--------------------------------------- */

function getCounter(move) {

    if (move === "ROCK")
        return "PAPER";


    if (move === "PAPER")
        return "SCISSORS";


    if (move === "SCISSORS")
        return "ROCK";

}


/* ---------------------------------------
   RESULT
--------------------------------------- */

function showResult(
    playerMove,
    robotMove
) {

    document.getElementById(
        "robotMove"
    ).innerText =
        "🤖 ROBOT: " + robotMove;


    document.getElementById(
        "result"
    ).innerText =
        "Predicted " +
        playerMove +
        " → Countered with " +
        robotMove;


    robotScore++;


    document.getElementById(
        "robotScore"
    ).innerText =
        robotScore;


    document.getElementById(
        "status"
    ).innerText =
        "ROUND COMPLETE";


    setTimeout(() => {

        resetRound();

    }, 2500);

}


/* ---------------------------------------
   RESET
--------------------------------------- */

function resetRound() {

    movementHistory = [];

    previousFeatures = null;

    predictionLocked = false;


    document.getElementById(
        "prediction"
    ).innerText =
        "🔮";


    document.getElementById(
        "confidence"
    ).innerText =
        "Confidence: --";


    document.getElementById(
        "robotMove"
    ).innerText =
        "🤖";


    document.getElementById(
        "result"
    ).innerText =
        "";


    document.getElementById(
        "status"
    ).innerText =
        "SHOW ME YOUR MOVE ✋";

}


/* ---------------------------------------
   BUTTON
--------------------------------------- */

window.startGame = function() {

    resetRound();

    document.getElementById(
        "status"
    ).innerText =
        "WATCHING YOUR HAND... 👀";

};


/* ---------------------------------------
   START
--------------------------------------- */

window.addEventListener(
    "load",
    async () => {

        await initializeAI();

        await startCamera();

    }
);

</script>


<style>

}

        );

    align-items: center;

}

    width: 94%;

<body>

<div class="container">

    <h1>
        🤖 Predictive RPS AI
    </h1>

    <div class="subtitle">
        AI tries to predict your move before you finish it
    </div>


    <div class="camera-box">

        <video
            id="camera"
            autoplay
            playsinline>
        </video>
